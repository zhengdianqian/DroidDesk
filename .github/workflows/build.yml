name: Build Release APK

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Flutter project lives in the app/ subdirectory.
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droiddesk-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DroidDesk 1.4.0
          fail_on_unmatched_files: true
          files: app/build/app/outputs/flutter-apk/app-release.apk
          body: |
            ## DroidDesk 1.4.0

            基于 1.3.3 源码（tag `v1.3.3`）继续迭代，versionCode 9，沿用同一签名（`droiddesk-release.jks`），可直接覆盖安装。

            ### 稳定性
            - 前台服务常驻 + 30 秒会话看护，桌面进程被回收后自动拉起（最多 3 次）
            - 桌面崩溃日志落盘（512 KiB 轮转），App 内可查看与清空
            - 安卓 12+ 子进程限制检测；root 可一键放宽，无 root 给出指引

            ### 软件源与安装
            - 修复 root/chroot 下商店包管理器目标错位导致的安装失败
            - 安装失败完整错误回显并写入日志
            - 一键换国内镜像（清华/中科大/阿里云自动探测）
            - 一键修复：`dpkg --configure -a`、`apt-get -f install`、刷新索引

            ### 桌面外观
            - 顶栏（应用菜单/任务列表/托盘/时钟）+ 底部 Dock（商店/终端/文件/浏览器）
            - 触屏尺寸，可切“省电/标准”，省电档关闭合成器与动画

            ### 中文环境
            - 默认 `zh_CN.UTF-8`，设置 LANG/LC_ALL/LANGUAGE
            - 预装 Noto CJK 字体，Xft DPI 随缩放同步
            - 默认 IBus + libpinyin 中文输入法

            ### 触控板输入法
            - 仅 X11 可编辑控件获得焦点（IBus FocusIn）时弹软键盘，失焦收起，可关闭

            ### 桌面商店与 deb
            - 桌面商店：搜索安装 apt 包、安装本地 .deb、一键修复软件源
            - deb 通过系统选择器安装（root/chroot），自动补依赖并保留错误信息
            - 自动生成桌面图标与开始菜单项

            ### 显示
            - 默认跟随设备：帧缓冲 = 物理像素 1:1，关闭线性过滤
            - 可选 1080p / 2K；界面缩放 1.0/1.25/1.5/2.0 在桌面内部完成，不拉伸画面
            - 设置页显示当前生效分辨率


      - name: Dump build log on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 80 /tmp/build.log > /tmp/tail.log || true
          BODY=$(printf '### CI build failed\n\n```\n%s\n```\n' "$(cat /tmp/tail.log)")
          gh api --method POST "repos/${{ github.repository }}/comments" \
            -f "commit_id=${{ github.sha }}" \
            -f "body=$BODY" || true
