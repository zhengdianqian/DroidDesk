name: Build Release APK

on:
  push:
    branches:
      - main
      - 'feat/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Flutter project lives in the app/ subdirectory.
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: droiddesk-release-apk
          path: |
            build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Prepare release asset
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "DroidDesk-${{ github.ref_name }}-arm64.apk"
          ls -l DroidDesk-*.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DroidDesk 1.4.4
          fail_on_unmatched_files: true
          files: DroidDesk-${{ github.ref_name }}-arm64.apk
          body: |
            ## DroidDesk 1.4.4

            基于 1.4.3 继续迭代，versionCode 13，沿用同一签名（`droiddesk-release.jks`），可直接覆盖安装。

            ### 1.4.4 更新
            - 输入法上屏：`sendTextEvent` 在 VTE 中不生效，改为内置 `droiddesk-x11-type`（XTest）；ASCII 走 keysym + 必要时 Shift，中文等非 Latin-1 字符映射为 Unicode keysym（`0x01000000 | codepoint`）后由 XTest 按下，候选词提交可真正进入终端
            - 输入法桥的删除、回车也改走同一注入通道（组合预览改动只删差异字符）
            - 商店网络：启动时探测设备代理 `127.0.0.1:2080`，可用则写入 apt `Acquire::http/https::Proxy` 与 `~/.bashrc`/运行时 `http_proxy/https_proxy`，由代理解析域名，绕开 guest 无法解析 DNS 的问题

            ### 1.4.3 更新（沿用）
            - 壁纸：桌面启动后按 `xfconf-query -l` 枚举实际存在的 `xfce4-desktop` last-image 通道，逐个写入壁纸并 `xfdesktop --reload`；0.75x 等缩放档位不再变纯黑
            - 启动耗时：`startSession` 每步（bootstrap/环境整理/图形检查/profile/launcher 同步/会话总线/无障碍总线/会话拉起）与各阶段（含等待桌面）都输出 `TIMING` 打点，定位 62 秒分布
            - 输入法：续 1.4.2 的 AT-SPI 焦点桥，保持只有可编辑控件聚焦时才请求系统输入法

            ### 1.4.2 更新（沿用）
            - 输入法：Termux 的 GTK3 没有 IBus 输入模块，改用 AT-SPI 无障碍总线判定焦点——只有可编辑控件（text/entry/terminal 等角色）获得焦点时才请求手机系统输入法，点空白处自动收起
            - 1:1 分辨率：桌面未就绪时自动清理 X 残留、socket 与锁，重试一次（只重试一次，不引入轮询看护）
            - 壁纸：为 monitorbuiltin / monitor0..3 补写 backdrop 配置，切换分辨率后不再变纯黑

            ### 启动可靠性
            - 启动前先清理上一次会话残留（xfce4-session/panel/xfwm4/dbus、`/tmp/.xfsm-ICE-*`）
            - 启动流程拆成阶段（清理/检查环境/挂载/启动 X/启动桌面/等待就绪），每阶段有超时，超时或异常直接回退到失败页并给出阶段与原因，不再无限转圈
            - 加载页显示当前阶段、已用时与取消按钮；失败页可复制完整错误、重试或返回
            - root 检测加超时；已安装 Ubuntu 但拿不到 root 时明确提示，不再静默退回 Termux 造成两种运行时混用
            - 同一时间只允许一个会话（互斥），重复点击不会叠加启动

            ### 中文环境
            - 新增幂等的“应用中文环境”迁移：老镜像也会执行 `locale-gen zh_CN.UTF-8`、写 `/etc/default/locale` 与 `~/.xprofile`、安装 Noto CJK、初始化 IBus + libpinyin
            - Termux 运行时不再硬编码 `LANG=en_US.UTF-8`
            - 设置页可手动触发，结果写入日志

            ### 软件源与安装
            - 安装失败时展示完整 `apt-get` 输出（可复制），并写入日志
            - 新增“诊断软件源”：架构、sources.list、resolv.conf、dpkg 锁、`dpkg --configure -a`、`apt-get update` 逐项结果

            ### 显示
            - 全屏改为 `WindowInsetsController` 真沉浸式，窗口尺寸/分辨率变化后重新应用
            - 切换分辨率会完整重启桌面会话，并记录切换前后帧缓冲尺寸

            ### 输入法
            - 改用系统输入法桥接：只有 X11 可编辑控件聚焦时才弹出手机输入法，失焦收起

            ### 日志与省电
            - 日志同时写 `/sdcard/Android/data/com.orailnoor.droiddesk/files/logs/desktop.log`，无需 root/run-as 即可 `adb pull`
            - 分层打点：`SESSION_START`/`MOUNT`/`X_START`/`DE_START`/`READY`/`SESSION_FAIL`/`IMEBRIDGE`/`DISPLAY`，带时间戳与耗时
            - 设置页桌面日志支持“导出日志”分享
            - 降低剪贴板与输入法焦点轮询频率，省电档进一步降频

      - name: Dump build log on failure
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -n 80 /tmp/build.log > /tmp/tail.log || true
          BODY=$(printf '### CI build failed\n\n```\n%s\n```\n' "$(cat /tmp/tail.log)")
          gh api --method POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f "body=$BODY" || true
